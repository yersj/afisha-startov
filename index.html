<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Календарь беговых стартов: марафоны, полумарафоны, серия TAN.">
<meta name="theme-color" content="#E2401F">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='8' fill='%23E2401F'/%3E%3Cpath d='M4 23c6-11 16-11 22 0M9 23c3.5-6 8.5-6 12 0' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Афиша стартов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: night-stadium hero with live countdown, month strip, then a grid of race "posters" (or a compact timeline) */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --ink:#10141A; --muted:#5D6674; --line:#D9DEE5; --chipbg:#F1F3F6;
  --accent:#E2401F; --accent-ink:#FFFFFF; --ok:#17804F; --okbg:#E1F4EA; --info:#2149C9; --infobg:#E5EBFB;
  --hero-bg:#0D1117; --hero-fg:#F3F5F8; --hero-muted:#8D97A6; --hero-lane:rgba(255,255,255,.07);
  --shadow:0 1px 2px rgba(16,20,26,.06),0 8px 24px -12px rgba(16,20,26,.18);
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0E13; --surface:#151A21; --ink:#ECEFF3; --muted:#98A2AF; --line:#262D37; --chipbg:#1D232C;
  --accent:#FF5B39; --accent-ink:#170602; --ok:#5DD497; --okbg:#12291E; --info:#8EA9FF; --infobg:#18213A;
  --hero-bg:#05070A; --hero-fg:#F3F5F8; --hero-muted:#8D97A6; --hero-lane:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0E13; --surface:#151A21; --ink:#ECEFF3; --muted:#98A2AF; --line:#262D37; --chipbg:#1D232C;
  --accent:#FF5B39; --accent-ink:#170602; --ok:#5DD497; --okbg:#12291E; --info:#8EA9FF; --infobg:#18213A;
  --hero-bg:#05070A; --hero-fg:#F3F5F8; --hero-muted:#8D97A6; --hero-lane:rgba(255,255,255,.06);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1160px;margin:0 auto;padding-inline:16px;padding-block:20px 72px;display:flex;flex-direction:column;gap:28px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
.club{font-family:var(--f-display);font-weight:600;font-size:15px;letter-spacing:.02em;line-height:1.2}
.club small{display:block;margin-top:2px;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.clubedit{display:flex;gap:6px}
.clubedit input{padding:6px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);min-width:0;width:200px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;transition:transform .12s ease,border-color .12s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost-dark{background:transparent;border-color:rgba(255,255,255,.22);color:var(--hero-fg)}
.btn.ghost-dark:hover{border-color:var(--hero-fg)}
.btn.sm{padding:7px 12px;font-size:13px}
.link{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:6px}
.link:hover{color:var(--accent)}
.link.danger{color:var(--accent);font-weight:600}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--hero-bg);color:var(--hero-fg);padding:clamp(22px,4vw,44px);display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:32px;align-items:end;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--accent) 45%, transparent) 0%, transparent 55%),
    repeating-linear-gradient(180deg, transparent 0 46px, var(--hero-lane) 46px 48px);}
.hero::after{content:"";position:absolute;right:-60px;bottom:-140px;width:520px;height:520px;border-radius:50%;border:44px solid color-mix(in srgb, var(--accent) 22%, transparent);z-index:-1}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--hero-muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}70%{box-shadow:0 0 0 10px transparent}100%{box-shadow:0 0 0 0 transparent}}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,5.4vw,60px);line-height:1;letter-spacing:-.02em;margin-top:14px}
.hero .sub{color:var(--hero-muted);margin-top:14px;font-size:16px;display:flex;flex-wrap:wrap;gap:6px 18px}
.hero .sub b{color:var(--hero-fg);font-weight:600}
.hero .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.count{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cell{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:14px 8px 10px;text-align:center;backdrop-filter:blur(4px)}
.cell .v{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,4.4vw,52px);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.cell.big .v{color:var(--accent)}
.cell .l{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--hero-muted);margin-top:8px}
.hero .chips{margin-top:16px}
.hero-empty{grid-column:1/-1;padding:24px 0}
.hero-empty h1{font-size:clamp(28px,5vw,48px)}

/* stats */
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1 1 150px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 18px}
.stat .v{font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}

/* month strip */
.months{display:grid;grid-template-columns:repeat(12,minmax(56px,1fr));gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.mon{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px 8px;cursor:pointer;text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center;min-width:0;transition:border-color .12s}
.mon:hover{border-color:var(--ink)}
.mon[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mon .mn{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.mon .yr{font-family:var(--f-mono);font-size:10px;opacity:.55}
.mon .bars{display:flex;gap:3px;height:6px}
.mon .bars i{width:6px;height:6px;border-radius:50%;background:var(--accent)}
.mon .bars i.off{background:var(--line)}
.mon.none{opacity:.45}

/* toolbar */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.search{flex:1 1 240px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:0 14px;min-width:0}
.search input{border:0;background:transparent;padding:10px 0;width:100%;outline:none}
.search svg{flex:none;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.f{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.f:hover{border-color:var(--ink)}
.f[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.f .n{font-family:var(--f-mono);font-size:11px;opacity:.65;margin-left:5px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:var(--chipbg);color:var(--ink);white-space:nowrap}
.chip.open{background:var(--okbg);color:var(--ok)}
.chip.soon{background:var(--infobg);color:var(--info)}
.chip.sold{background:var(--chipbg);color:var(--muted)}
.chip.tent{background:transparent;border:1px dashed var(--muted);color:var(--muted)}
.hero .chip.tent{border-color:var(--hero-muted);color:var(--hero-muted);background:transparent}
.chip.series{background:var(--ink);color:var(--bg);letter-spacing:.12em}
.hero .chip.series{background:var(--hero-fg);color:var(--hero-bg)}
.hero .chip{background:rgba(255,255,255,.1);color:var(--hero-fg)}
.hero .chip.open{background:color-mix(in srgb,#5DD497 22%,transparent);color:#7CE3AE}

/* section heads */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,3vw,26px)}
.sec-h span{color:var(--muted);font-size:14px}

/* poster grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease;min-width:0}
.card:hover{transform:translateY(-4px)}
.poster{position:relative;aspect-ratio:16/10;max-width:100%;padding:16px 18px;color:#fff;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;isolation:isolate}
.poster::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(180deg,transparent 0 30px,rgba(255,255,255,.09) 30px 31px)}
.poster::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;border:26px solid rgba(255,255,255,.12);z-index:-1}
.poster .ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.cc{font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:.12em;background:rgba(0,0,0,.25);padding:4px 8px;border-radius:8px}
.when{font-family:var(--f-mono);font-size:11px;font-weight:700;letter-spacing:.06em;background:#fff;color:#111;padding:4px 9px;border-radius:999px;white-space:nowrap}
.when.hot{background:#111;color:#fff}
.km{font-family:var(--f-display);font-weight:900;font-size:clamp(46px,7vw,64px);line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.km sup{font-size:.28em;font-weight:600;letter-spacing:.06em;vertical-align:top;margin-left:4px;position:relative;top:.4em}
.city{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;opacity:.9;margin-top:6px}
.cbody{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.cdate{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.cdate b{color:var(--ink);font-weight:600}
.card h3{font-size:18px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.note{margin:0;color:var(--muted);font-size:14px}
.who{font-size:14px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.who em{font-style:normal;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
.cfoot{margin-top:auto;padding-top:12px;border-top:1px dashed var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.price{font-family:var(--f-mono);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.price small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.cbtns{display:flex;gap:6px}
.admin{display:flex;gap:4px;justify-content:flex-end}
.card.past{opacity:.6}
.card.past .poster{filter:grayscale(.85)}

/* timeline list */
.tl{display:flex;flex-direction:column;gap:26px}
.tl-m{display:flex;flex-direction:column;gap:10px}
.tl-m h3{font-family:var(--f-display);font-weight:600;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px}
.tl-m h3::after{content:"";flex:1;height:1px;background:var(--line)}
.row{display:grid;grid-template-columns:64px 6px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.row .d{text-align:center}
.row .d b{display:block;font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1;font-variant-numeric:tabular-nums}
.row .d span{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.row .bar{align-self:stretch;border-radius:4px}
.row .mid{min-width:0;display:flex;flex-direction:column;gap:6px}
.row h4{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.row .meta{font-size:13px;color:var(--muted)}
.row .end{display:flex;flex-direction:column;align-items:flex-end;gap:8px}

.empty{border:2px dashed var(--line);border-radius:22px;padding:40px 22px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty strong{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink)}
details.past{border-top:1px solid var(--line);padding-top:20px}
details.past summary{cursor:pointer;font-weight:600;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center}
details.past summary::before{content:"▸";transition:transform .15s}
details.past[open] summary::before{transform:rotate(90deg)}
details.past .grid{margin-top:18px}
footer{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}

/* editor */
.overlay{position:fixed;inset:0;background:rgba(5,7,10,.55);display:grid;place-items:center;padding:16px;z-index:10;backdrop-filter:blur(3px)}
.panel{background:var(--surface);border-radius:24px;width:min(600px,100%);max-height:calc(100% - 32px);overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.panel h2{font-family:var(--f-display);font-weight:800;font-size:22px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);width:100%}
.field small{color:var(--muted);font-size:12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.err{color:var(--accent);font-size:14px;margin:0}
.pactions{display:flex;justify-content:flex-end;gap:8px}

@media (max-width:760px){
  .hero{grid-template-columns:1fr;gap:24px;border-radius:22px}
  .row{grid-template-columns:52px 5px minmax(0,1fr);gap:12px}
  .row .end{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between}
  .g2{grid-template-columns:1fr}
}
@media (max-width:560px){
  .wrap{gap:20px;padding-block:12px 56px}
  .top .btn.primary{padding:9px 14px;font-size:13px}
  .hero{padding:22px 18px 18px;border-radius:20px}
  .hero::after{width:300px;height:300px;border-width:28px;right:-90px;bottom:-120px}
  .hero h1{font-size:28px;margin-top:10px}
  .hero .sub{font-size:14px;gap:4px 14px}
  .hero .actions{display:grid;grid-template-columns:1fr;gap:8px}
  .hero .actions .btn{width:100%}
  .count{gap:6px}
  .cell{padding:10px 4px 8px;border-radius:12px}
  .cell .v{font-size:26px}
  .cell .l{font-size:9px;letter-spacing:.08em}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stat{padding:10px 12px;border-radius:14px}
  .stat .v{font-size:22px}
  .stat .l{font-size:12px;line-height:1.3}
  .months{display:flex;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x mandatory}
  .mon{flex:0 0 58px;scroll-snap-align:start}
  .toolbar{flex-direction:column;align-items:stretch}
  .search{flex:0 0 auto}
  .eyebrow{flex-wrap:nowrap;align-items:flex-start;font-size:11px;letter-spacing:.14em}
  .eyebrow .dot{margin-top:3px;flex:none}
  .months{align-items:flex-start}
  .mon{height:auto}
  .seg{align-self:flex-start}
  .filters{margin-inline:-16px;padding-inline:16px}
  .grid{gap:14px}
  .card{border-radius:18px}
  .card:hover{transform:none}
  .poster{aspect-ratio:16/8}
  .km{font-size:48px}
  .cfoot .cbtns{flex:1;justify-content:flex-end}
  .panel{padding:18px;border-radius:20px}
  .overlay{align-items:end;padding:0}
  .overlay .panel{border-radius:20px 20px 0 0;max-height:92%;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="root">
  <div class="wrap"><section class="hero"><div class="hero-empty"><div class="eyebrow">Афиша стартов</div><h1>Загружаем календарь…</h1></div></section></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState, useEffect, useMemo, useRef} = React;
const html = htm.bind(React.createElement);

/* ---------- helpers ---------- */
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MSHORT = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MGEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['вс','пн','вт','ср','чт','пт','сб'];
const CC = {'казахстан':'KZ','испания':'ES','сша':'US','турция':'TR','китай':'CN','португалия':'PT','япония':'JP','чехия':'CZ','германия':'DE','россия':'RU','узбекистан':'UZ','кыргызстан':'KG','грузия':'GE','оаэ':'AE','великобритания':'GB','франция':'FR','италия':'IT','австралия':'AU','юар':'ZA','нидерланды':'NL'};
const GRADS = [
  ['#E2401F','#FF8A3D'], ['#0F5E5A','#21A88A'], ['#1B2A6B','#3D6BFF'], ['#7A2E1E','#E07A2E'],
  ['#3B1F4F','#C2417A'], ['#1E3A2B','#7DBB3C'], ['#13161C','#4A5566'], ['#8A5A00','#F2B233'],
];
const FILTERS = [
  {id:'all', label:'Все'},
  {id:'open', label:'Регистрация открыта', test:r=>r.status==='Открыто'},
  {id:'tan', label:'Серия TAN', test:r=>/tan/i.test(r.series||'')},
  {id:'kz', label:'Казахстан', test:r=>/казахстан/i.test(r.country||'')},
  {id:'abroad', label:'За рубежом', test:r=>!!r.country && !/казахстан/i.test(r.country)},
  {id:'42', label:'Марафон', test:r=>r.d.some(x=>x>=42&&x<43)},
  {id:'21', label:'Полумарафон', test:r=>r.d.some(x=>x>=21&&x<22)},
  {id:'10', label:'10 км', test:r=>r.d.some(x=>x===10)},
  {id:'5', label:'5 км', test:r=>r.d.some(x=>x===5)},
  {id:'trail', label:'Трейл', test:r=>r.kind==='Трейл'},
];
const DAYS = ['день','дня','дней'];
const plural = (n,f) => { n=Math.abs(n)%100; const a=n%10; if(n>10&&n<20) return f[2]; if(a>1&&a<5) return f[1]; if(a===1) return f[0]; return f[2]; };
const parseDate = s => { const [y,m,d]=String(s).split('-').map(Number); return new Date(y,(m||1)-1,d||1); };
const today = () => { const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); };
const daysUntil = s => Math.round((parseDate(s)-today())/864e5);
const fmtDate = (s,wd) => { const d=parseDate(s); return d.getDate()+' '+MGEN[d.getMonth()]+(wd?', '+WD[d.getDay()]:''); };
const fmtKm = x => (Number.isInteger(x)?String(x):x.toFixed(1)).replace('.',',');
const parseDist = v => Array.isArray(v) ? v.map(Number).filter(x=>x>0) : String(v||'').split(/[,;\s]+/).map(x=>parseFloat(x.replace(',','.'))).filter(x=>x>0);
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '';
const cc = c => CC[String(c||'').trim().toLowerCase()] || (c ? String(c).slice(0,2).toUpperCase() : '');
const hash = s => { let h=0; for (const ch of String(s)) h=(h*31+ch.charCodeAt(0))|0; return Math.abs(h); };
const grad = r => { const g=GRADS[hash(r.city||r.title)%GRADS.length]; return `linear-gradient(135deg, ${g[0]} 0%, ${g[1]} 100%)`; };
const gradColor = r => GRADS[hash(r.city||r.title)%GRADS.length][0];
const untilLabel = n => n===0 ? 'Сегодня' : n===1 ? 'Завтра' : n<0 ? `${-n} ${plural(n,DAYS)} назад` : `через ${n} ${plural(n,DAYS)}`;
const norm = r => ({...r, d: parseDist(r.distances).sort((a,b)=>b-a)});
function gcal(r){
  const d=parseDate(r.date), e=new Date(d); e.setDate(e.getDate()+1);
  const ymd=x=>x.getFullYear()+String(x.getMonth()+1).padStart(2,'0')+String(x.getDate()).padStart(2,'0');
  const details=[r.d.length?'Дистанции: '+r.d.map(x=>fmtKm(x)+' км').join(', '):'', r.time?'Старт в '+r.time:'', r.note||'', safeUrl(r.url)].filter(Boolean).join('\n');
  return 'https://calendar.google.com/calendar/render?'+new URLSearchParams({action:'TEMPLATE',text:r.title||'Старт',dates:ymd(d)+'/'+ymd(e),details,location:[r.place,r.city,r.country].filter(Boolean).join(', ')});
}
const store = { get(k,d){ try{ return localStorage.getItem(k) ?? d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

/* ---------- small pieces ---------- */
function StatusChip({r}){
  if (r.status==='Открыто') return html`<span class="chip open">● Слоты открыты</span>`;
  if (r.status==='Анонс') return html`<span class="chip soon">Анонс</span>`;
  if (r.status==='Продано') return html`<span class="chip sold">Слоты проданы</span>`;
  return null;
}
function Chips({r}){
  return html`<div class="chips">
    ${r.series ? html`<span class="chip series">${r.series}</span>` : null}
    ${r.tentative ? html`<span class="chip tent">Дата уточняется</span>` : null}
    <${StatusChip} r=${r}/>
    ${r.d.map(x=>html`<span class="chip" key=${x}>${fmtKm(x)} км</span>`)}
    ${r.kind && r.kind!=='Шоссе' ? html`<span class="chip">${r.kind}</span>` : null}
  </div>`;
}
function Who({r}){ return r.runners ? html`<div class="who"><em>Бегут</em><span>${r.runners}</span></div>` : null; }

function Countdown({r}){
  const [now,setNow] = useState(Date.now());
  useEffect(()=>{ const t=setInterval(()=>setNow(Date.now()),1000); return ()=>clearInterval(t); },[]);
  const [hh,mm] = (r.time||'07:00').split(':').map(Number);
  const target = parseDate(r.date); target.setHours(hh||0, mm||0, 0, 0);
  let s = Math.max(0, Math.floor((target-now)/1000));
  const d=Math.floor(s/86400); s-=d*86400; const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); s-=m*60;
  const p = n => String(n).padStart(2,'0');
  return html`<div class="count" role="timer" aria-label=${`До старта ${d} ${plural(d,DAYS)}`}>
    <div class="cell big"><div class="v">${d}</div><div class="l">${plural(d,DAYS)}</div></div>
    <div class="cell"><div class="v">${p(h)}</div><div class="l">часов</div></div>
    <div class="cell"><div class="v">${p(m)}</div><div class="l">минут</div></div>
    <div class="cell"><div class="v">${p(s)}</div><div class="l">секунд</div></div>
  </div>`;
}

  </div></section>`;
  if (!next) return html`<section class="hero"><div class="hero-empty">
    <div class="eyebrow">Афиша стартов</div><h1>Ближайших стартов пока нет</h1>
    <p class="sub">${isAdmin ? 'Добавьте первый старт, и здесь запустится обратный отсчёт.' : 'Скоро здесь появятся новые старты.'}</p>
    ${isAdmin ? html`<div class="actions"><button class="btn primary" onClick=${onAdd}>+ Добавить старт</button></div>` : null}

  const url = safeUrl(next.url);
  return html`<section class="hero">
    <div>
      <div class="eyebrow"><span class="dot"></span>Ближайший старт · ${fmtDate(next.date,true)}</div>
      <h1>${next.title}</h1>
      <div class="sub">
        <span>📍 <b>${[next.city,next.country].filter(Boolean).join(', ')}</b></span>
        ${next.time ? html`<span>Старт в <b>${next.time}</b></span>` : null}
        ${next.price ? html`<span>Слот <b>${next.price}</b></span>` : null}
      </div>
      <${Chips} r=${next}/>
      <div class="actions">
        ${url ? html`<a class="btn primary" href=${url} target="_blank" rel="noopener">Регистрация ↗</a>` : null}

}

function Card({r, past, isAdmin, onEdit, onDelete}){
  const n = daysUntil(r.date), url = safeUrl(r.url), main = r.d[0];
  const [arm,setArm] = useState(false);
  useEffect(()=>{ if(!arm) return; const t=setTimeout(()=>setArm(false),3500); return ()=>clearTimeout(t); },[arm]);
  return html`<article class=${'card'+(past?' past':'')}>
    <div class="poster" style=${{background:grad(r)}}>
      <div class="ptop">
        <span class="cc">${cc(r.country) || '—'}</span>
        <span class=${'when'+(!past&&n<=14?' hot':'')}>${untilLabel(n)}</span>
      </div>
      <div>
        <div class="km">${main ? fmtKm(main) : '—'}<sup>КМ</sup></div>
        <div class="city">${r.city || r.country || ''}</div>
      </div>
    </div>
    <div class="cbody">
      <div class="cdate"><b>${fmtDate(r.date,true)}</b>${r.time ? html`<span>· ${r.time}</span>` : null}</div>
      <h3>${r.title}</h3>
      <${Chips} r=${r}/>
      <${Who} r=${r}/>
      ${r.note ? html`<p class="note">${r.note}</p>` : null}
      <div class="cfoot">
        <div class="price">${r.price ? html`<small>Слот</small>${r.price}` : html`<small>Тип</small>${r.kind||'Шоссе'}`}</div>
        ${!past ? html`<div class="cbtns">
          <a class="btn sm" href=${gcal(r)} target="_blank" rel="noopener" title="Добавить в Google Календарь" aria-label="Добавить в Google Календарь">＋📅</a>
          ${url ? html`<a class="btn sm primary" href=${url} target="_blank" rel="noopener">${r.status==='Открыто'?'Регистрация':'Подробнее'} ↗</a>` : null}
        </div>` : null}
      </div>
      ${isAdmin ? html`<div class="admin">
        <button class="link" onClick=${()=>onEdit(r)}>Изменить</button>
        <button class=${'link'+(arm?' danger':'')} onClick=${()=>arm?onDelete(r):setArm(true)}>${arm?'Точно удалить?':'Удалить'}</button>
      </div>` : null}
    </div>
  </article>`;
}

function Row({r, isAdmin, onEdit}){
  const d=parseDate(r.date), n=daysUntil(r.date), url=safeUrl(r.url);
  return html`<article class="row">
    <div class="d"><b>${d.getDate()}</b><span>${WD[d.getDay()]}</span></div>
    <div class="bar" style=${{background:gradColor(r)}}></div>
    <div class="mid">
      <h4>${r.title}</h4>
      <div class="meta">📍 ${[r.city,r.country].filter(Boolean).join(', ')}${r.price ? ' · слот '+r.price : ''}</div>
      <${Chips} r=${r}/>
      <${Who} r=${r}/>
    </div>
    <div class="end">
      <span class="chip">${untilLabel(n)}</span>
      <div class="cbtns">
        <a class="btn sm" href=${gcal(r)} target="_blank" rel="noopener" aria-label="Добавить в Google Календарь">＋📅</a>
        ${url ? html`<a class="btn sm primary" href=${url} target="_blank" rel="noopener">${r.status==='Открыто'?'Регистрация':'Подробнее'} ↗</a>` : null}
        ${isAdmin ? html`<button class="link" onClick=${()=>onEdit(r)}>Изменить</button>` : null}
      </div>
    </div>
  </article>`;
}

function MonthStrip({up, month, setMonth}){
  const t = today(), list = [];
  for (let i=0;i<12;i++){ const d=new Date(t.getFullYear(), t.getMonth()+i, 1); list.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'), m:d.getMonth(), y:d.getFullYear()}); }
  return html`<div class="months" role="group" aria-label="Месяцы">
    ${list.map(x=>{
      const c = up.filter(r=>r.date.startsWith(x.key)).length;
      return html`<button key=${x.key} class=${'mon'+(c?'':' none')} aria-pressed=${month===x.key} onClick=${()=>setMonth(month===x.key?null:x.key)}>
        <span class="mn">${MSHORT[x.m]}</span>
        <span class="bars">${c ? Array.from({length:Math.min(c,4)},(_,i)=>html`<i key=${i}></i>`) : html`<i class="off"></i>`}</span>
        <span class="yr">${x.y}</span>
      </button>`;
    })}
  </div>`;
}

const FIELDS = ['title','date','time','city','country','place','series','status','price','dist','kind','url','runners','note'];
function Editor({race, onClose, onSave}){
  const [v,setV] = useState(()=> race && race.id ? {...race, dist: parseDist(race.distances).join(', ')} : {kind:'Шоссе', status:'', country:'Казахстан'});
  const [err,setErr] = useState(''); const [busy,setBusy] = useState(false);
  const first = useRef(null);
  useEffect(()=>{ first.current && first.current.focus(); const k=e=>{ if(e.key==='Escape') onClose(); }; document.addEventListener('keydown',k); return ()=>document.removeEventListener('keydown',k); },[]);
  const set = k => e => setV({...v, [k]: e.target.value});
  const submit = async e => {
    e.preventDefault();
    if (!String(v.title||'').trim() || !v.date) return setErr('Укажите название и дату старта.');
    if (v.url && !safeUrl(v.url)) return setErr('Ссылка должна начинаться с https://');
    const doc = {}; FIELDS.forEach(k=>{ if(k!=='dist') doc[k]=String(v[k]||'').trim(); });
    doc.distances = parseDist(v.dist); doc.example = false; doc.tentative = !!v.tentative;
    setBusy(true);
    try { await onSave(race && race.id, doc); onClose(); }
    catch(ex){ setErr(ex && ex.code==='invalid_argument' ? 'Нет прав на изменение афиши.' : 'Не удалось сохранить. Попробуйте ещё раз.'); }
    finally { setBusy(false); }
  };
  const F = (id,label,props={}) => html`<div class="field"><label for=${'f-'+id}>${label}</label><input id=${'f-'+id} value=${v[id]||''} onInput=${set(id)} ...${props}/></div>`;
  return html`<div class="overlay" onClick=${e=>{ if(e.target===e.currentTarget) onClose(); }}>
    <form class="panel" onSubmit=${submit} noValidate>
      <h2>${race && race.id ? 'Изменить старт' : 'Новый старт'}</h2>
      <div class="field"><label for="f-title">Название</label><input id="f-title" ref=${first} value=${v.title||''} onInput=${set('title')} placeholder="Almaty Marathon 2027"/></div>
      <div class="g2">${F('date','Дата',{type:'date'})}${F('time','Время старта',{type:'time'})}</div>
      <label class="check"><input id="f-tentative" type="checkbox" checked=${!!v.tentative} onChange=${e=>setV({...v,tentative:e.target.checked})}/> Дата ориентировочная</label>
      <div class="g2">${F('city','Город',{placeholder:'Алматы'})}${F('country','Страна',{placeholder:'Казахстан'})}</div>
      <div class="g2">
        <div class="field"><label for="f-dist">Дистанции, км</label><input id="f-dist" value=${v.dist||''} onInput=${set('dist')} placeholder="42.2, 21.1, 10"/><small>Через запятую</small></div>
        <div class="field"><label for="f-kind">Тип</label><select id="f-kind" value=${v.kind||'Шоссе'} onChange=${set('kind')}>${['Шоссе','Трейл','Стадион','Клубный забег','Другое'].map(o=>html`<option key=${o}>${o}</option>`)}</select></div>
      </div>
      <div class="g2">
        <div class="field"><label for="f-status">Регистрация</label><select id="f-status" value=${v.status||''} onChange=${set('status')}><option value="">Не указано</option><option>Открыто</option><option>Анонс</option><option>Продано</option></select></div>
        ${F('price','Цена слота',{placeholder:'417 389 ₸'})}
      </div>
      <div class="g2">${F('url','Ссылка на регистрацию',{type:'url',placeholder:'https://'})}${F('series','Серия',{placeholder:'TAN'})}</div>
      ${F('runners','Кто из клуба бежит',{placeholder:'Айдар (42.2), Мадина (10)'})}
      <div class="field"><label for="f-note">Заметка</label><textarea id="f-note" rows="2" value=${v.note||''} onInput=${set('note')} placeholder="Сбор клуба у шатра в 6:45"></textarea></div>
      ${err ? html`<p class="err">${err}</p>` : null}
      <div class="pactions"><button type="button" class="btn" onClick=${onClose}>Отмена</button><button type="submit" class="btn primary" disabled=${busy}>${busy?'Сохраняем…':'Сохранить'}</button></div>
    </form>
  </div>`;
}

function ClubName({club, isAdmin, onRename}){
  const [edit,setEdit] = useState(false); const [val,setVal] = useState('');
  if (edit) return html`<div class="clubedit">
    <input id="club-input" value=${val} maxLength="60" aria-label="Название клуба" onInput=${e=>setVal(e.target.value)}
      onKeyDown=${e=>{ if(e.key==='Enter'){ onRename(val.trim()); setEdit(false);} if(e.key==='Escape') setEdit(false); }} autoFocus/>
    <button class="btn sm primary" onClick=${()=>{ onRename(val.trim()); setEdit(false); }}>OK</button>
  </div>`;
  return html`<div class="club"><small>Беговой клуб</small>${club.name || 'Наш клуб'}
    ${isAdmin ? html` <button class="link" onClick=${()=>{ setVal(club.name||''); setEdit(true); }}>✎</button>` : null}</div>`;
}

/* ---------- app ---------- */
function App(){
  const [races,setRaces] = useState([]);
  const [loaded,setLoaded] = useState(false);
  const [dbState,setDbState] = useState('pending');
  const [isAdmin,setIsAdmin] = useState(false);
  const [club,setClub] = useState({name:''});
  const [filter,setFilter] = useState(()=>{ const f=store.get('afisha-filter','all'); return FILTERS.some(x=>x.id===f)?f:'all'; });
  const [view,setView] = useState(()=>store.get('afisha-view','cards'));
  const [month,setMonth] = useState(null);
  const [q,setQ] = useState('');
  const [editing,setEditing] = useState(null);
  const dbRef = useRef(null);
  const [, tick] = useState(0);

  useEffect(()=>{
    fetch('races.json?v='+Date.now()).then(r=>r.json()).then(j=>{ setRaces(j.races||[]); setLoaded(true); setDbState('ok'); }).catch(()=>setDbState('none'));
    const t = setInterval(()=>tick(x=>x+1), 60*60*1000);
    return ()=>clearInterval(t);
  },[]);
  useEffect(()=>store.set('afisha-filter',filter),[filter]);
  useEffect(()=>store.set('afisha-view',view),[view]);

  const all = useMemo(()=>races.filter(r=>r.date&&r.title).map(norm).sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||'')),[races]);
  const up = all.filter(r=>daysUntil(r.date)>=0);
  const past = all.filter(r=>daysUntil(r.date)<0).reverse();
  const next = up[0];
  const f = FILTERS.find(x=>x.id===filter) || FILTERS[0];
  const ql = q.trim().toLowerCase();
  const shown = up.filter(r => (!f.test || f.test(r)) && (!month || r.date.startsWith(month)) &&
    (!ql || [r.title,r.city,r.country,r.runners].join(' ').toLowerCase().includes(ql)));
  const openCount = up.filter(r=>r.status==='Открыто').length;
  const countries = new Set(up.map(r=>cc(r.country)).filter(Boolean)).size;

  const save = async (id, doc) => { const db=dbRef.current; if(!db) throw {code:'unavailable'}; if(id) await db.collection('races').doc(id).set(doc); else await db.collection('races').add(doc); };
  const del = async r => { try { await dbRef.current.collection('races').doc(r.id).delete(); } catch(e){} };
  const rename = async name => { if(!name || !dbRef.current) return; setClub(c=>({...c,name})); try { await dbRef.current.doc('meta/club').set({name}); } catch(e){} };

  const groups = [];
  shown.forEach(r=>{ const k=r.date.slice(0,7); const g=groups[groups.length-1]; if(g&&g.k===k) g.items.push(r); else groups.push({k,items:[r]}); });

  return html`<div class="wrap">
    <header class="top">
      <div class="brand">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 30 30" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M3 23c6-11 18-11 24 0"/><path d="M8.5 23c4-6.5 9-6.5 13 0"/><path d="M14 23c.6-1.4 1.4-1.4 2 0"/></svg></div>
        <div class="club">Афиша стартов<small>Марафоны и забеги · ${new Date().getFullYear()}–${new Date().getFullYear()+1}</small></div>
      </div>
      ${isAdmin ? html`<button class="btn primary" onClick=${()=>setEditing({})}>+ Добавить старт</button>` : null}
    </header>

    <${Hero} next=${next} loaded=${loaded} dbState=${dbState} isAdmin=${isAdmin} onAdd=${()=>setEditing({})}/>

    ${loaded && up.length ? html`<div class="stats">
      <div class="stat"><div class="v">${up.length}</div><div class="l">${plural(up.length,['старт','старта','стартов'])} впереди</div></div>
      <div class="stat"><div class="v">${up.filter(r=>/казахстан/i.test(r.country||'')).length}</div><div class="l">в Казахстане</div></div>
      <div class="stat"><div class="v">${countries}</div><div class="l">${plural(countries,['страна','страны','стран'])}</div></div>
    </div>` : null}

    ${loaded && up.length ? html`
      <${MonthStrip} up=${up} month=${month} setMonth=${setMonth}/>
      <div class="toolbar">
        <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Поиск: город, старт, участник" value=${q} onInput=${e=>setQ(e.target.value)} aria-label="Поиск стартов"/></label>
        <div class="seg" role="group" aria-label="Вид">
          <button aria-pressed=${view==='cards'} onClick=${()=>setView('cards')}>Карточки</button>
          <button aria-pressed=${view==='list'} onClick=${()=>setView('list')}>Список</button>
        </div>
      </div>
      <div class="filters" role="group" aria-label="Фильтры">
        ${FILTERS.map(x=>{ const c=x.test?up.filter(x.test).length:up.length; if(x.id!=='all'&&!c&&x.id!==filter) return null;
          return html`<button key=${x.id} class="f" aria-pressed=${x.id===filter} onClick=${()=>setFilter(x.id)}>${x.label}<span class="n">${c}</span></button>`; })}
      </div>
      <div class="sec-h"><h2>${month ? MONTHS[+month.slice(5)-1][0].toUpperCase()+MONTHS[+month.slice(5)-1].slice(1)+' '+month.slice(0,4) : 'Все старты'}</h2><span>${shown.length} ${plural(shown.length,['старт','старта','стартов'])}</span></div>
      ${!shown.length ? html`<div class="empty"><strong>Ничего не нашлось</strong><span>Сбросьте фильтр, месяц или поиск.</span><button class="btn sm" onClick=${()=>{setFilter('all');setMonth(null);setQ('');}}>Показать все старты</button></div>`
        : view==='cards' ? html`<div class="grid">${shown.map(r=>html`<${Card} key=${r.id} r=${r} isAdmin=${isAdmin} onEdit=${setEditing} onDelete=${del}/>`)}</div>`
        : html`<div class="tl">${groups.map(g=>html`<section class="tl-m" key=${g.k}><h3>${MONTHS[+g.k.slice(5)-1]} ${g.k.slice(0,4)}</h3>${g.items.map(r=>html`<${Row} key=${r.id} r=${r} isAdmin=${isAdmin} onEdit=${setEditing}/>`)}</section>`)}</div>`}
    ` : null}

    ${past.length ? html`<details class="past"><summary>Прошедшие старты · ${past.length}</summary>
      <div class="grid">${past.map(r=>html`<${Card} key=${r.id} r=${r} past=${true} isAdmin=${isAdmin} onEdit=${setEditing} onDelete=${del}/>`)}</div></details>` : null}

    <footer><span>Даты и цены проверяйте на сайте организатора.</span><span>Хороших стартов!</span></footer>
    ${editing ? html`<${Editor} race=${editing} onClose=${()=>setEditing(null)} onSave=${save}/>` : null}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>

</body>
</html>
